---
name: Security & Future Compatibility
'on':
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    - cron: '15 4 * * 1' # weekly on Mondays, 4:15 AM UTC
jobs:
  security-and-future-compat:
    name: Test and run security checks on Go tip
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    container:
      image: golang:tip
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - name: ✔ Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🌱 Environment
        run: |
          go env -w GOMODCACHE="$HOME/go/pkg/mod"
      - name: 📦 Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: tip-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            tip-${{ runner.os }}-
      - name: 🤖 Vulnerability Scanner
        run: |-
          go run golang.org/x/vuln/cmd/govulncheck@master ./...
          test -f scopeguard-mcp/go.mod && go run -C scopeguard-mcp golang.org/x/vuln/cmd/govulncheck@master ./...
      - name: ⬆️ Update to latest dependency versions
        run: >
          find . -name go.mod -execdir go get -u -t ./... \; -execdir go mod tidy \;
      - name: 🔨 Test
        run: |-
          go version
          go test ./...
          test -f scopeguard-mcp/go.mod && go -C scopeguard-mcp test ./...
