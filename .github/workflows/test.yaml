---
name: Test
"on":
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
jobs:
  test:
    name: Test on Go ${{ matrix.go }}
    permissions:
      checks: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      matrix:
        go: ["1.26", "1.25"]
        include:
          - go: "1.26"
            go-version: "1.26.2"
            latest: true
          - go: "1.25"
            go-version: "1.25.9"
    env:
      GOTOOLCHAIN: local
      GOPRIVATE: fillmore-labs.com
    steps:
      - name: ✔ Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: 🐹 Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: "**/go.sum"
      - name: 🧸 golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        if: ${{ matrix.latest }}
        with:
          version: v2.11.4
          verify: false
      - name: ⬇️ Download test packages
        run: (cd ./internal/reachability/tracker/testdata && go mod download)
      - name: 🔨 Test
        run: go test -coverpkg ./... -coverprofile=cover.out ./...
      - name: 🔨 Test MCP
        run: test -f scopeguard-mcp/go.mod && go test -C scopeguard-mcp -coverpkg ./... -coverprofile=cover.out ./...
        if: ${{ matrix.latest }}
      - name: 🧑🏻‍💻 codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        if: ${{ matrix.latest }}
        with:
          disable_search: true
          files: ./cover.out,./scopeguard-mcp/cover.out
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: fillmore-labs/scopeguard
