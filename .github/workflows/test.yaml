---
name: Test
'on':
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
jobs:
  test:
    name: Test on Go ${{ matrix.go }}
    permissions:
      checks: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    strategy:
      matrix:
        go: ['1.27', '1.26', '1.25']
        include:
          - go: '1.27'
            go-version: '1.27.0-rc.2'
          - go: '1.26'
            go-version: '1.26.5'
            latest: true
          - go: '1.25'
            go-version: '1.25.12'
    env:
      GOTOOLCHAIN: local
    steps:
      - name: ✔ Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐹 Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: '**/go.sum'
      - name: 🧸 golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: ${{ matrix.latest }}
        with:
          version: v2.12.2
          verify: false
      - name: ⬇️ Download test packages
        run: (cd ./internal/reachability/tracker/testdata && go mod download)
      - name: 🔨 Test
        run: go test -coverpkg ./... -coverprofile=cover.out ./...
      - name: 🔨 Test MCP
        run: test -f scopeguard-mcp/go.mod && go test -C scopeguard-mcp -coverpkg ./... -coverprofile=cover.out ./...
        if: ${{ matrix.latest }}
      - name: 🧑🏻‍💻 codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        if: ${{ matrix.latest }}
        with:
          disable_search: true
          files: ./cover.out,./scopeguard-mcp/cover.out
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: fillmore-labs/scopeguard
