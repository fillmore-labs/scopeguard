---
name: Test
'on':
  push:
    branches:
      - main
jobs:
  test:
    name: Test on Go ${{ matrix.go }}
    permissions:
      checks: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: codeberg-small-lazy
    timeout-minutes: 10
    strategy:
      matrix:
        go: ['1.27', '1.26', '1.25']
        include:
          - go: '1.27'
            go-version: '1.27.0-rc.2'
          - go: '1.26'
            go-version: '1.26.5'
            latest: true
          - go: '1.25'
            go-version: '1.25.12'
    env:
      GOTOOLCHAIN: local
    steps:
      - name: ✔ Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐹 Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: '**/go.sum'
      - name: ⬇️ Download test packages
        run: (cd ./internal/reachability/tracker/testdata && go mod download)
      - name: 🔨 Test
        run: go test ./...
