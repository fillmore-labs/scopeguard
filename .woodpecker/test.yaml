---
when:
  - event: push
    branch: [main, dev]

matrix:
  GO_VERSION:
    - '1.27rc2'
    - '1.26.5'
    - '1.25.12'

steps:
  - name: test
    image: golang:${GO_VERSION}
    environment:
      GOTOOLCHAIN: local
      GOPRIVATE: fillmore-labs.com
    commands:
      - go mod download && (cd ./internal/reachability/tracker/testdata && go mod download)
      - echo "🔨 Testing on $(go version):"
      - go test ./...

  - name: test MCP
    image: golang:${GO_VERSION}
    environment:
      GOTOOLCHAIN: local
      GOPRIVATE: fillmore-labs.com
    commands:
      - echo "🔨 Testing on $(go version):"
      - go -C scopeguard-mcp test . ./internal/server/... ./internal/tools/...
    when:
      - evaluate: 'GO_VERSION startsWith "1.26"'
